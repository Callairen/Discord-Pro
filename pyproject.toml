[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-pro"
version = "2.0.0"
description = "Integrated Discord Rich Presence manager: local backend, desktop GUI and web dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3",
    "pypresence==4.6.2",
    "psutil>=5.9",
    "websockets>=13",
    "PySide6-Essentials>=6.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "playwright>=1.45", "pyinstaller>=6.6"]

[project.scripts]
discord-pro = "discord_pro.__main__:main"

[tool.setuptools.packages.find]
include = ["discord_pro*"]

[tool.setuptools.package-data]
discord_pro = ["web/*"]
