[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    e2e: end-to-end tests that start real processes or browsers
    gui: desktop GUI tests (require PySide6 and an offscreen Qt platform)
filterwarnings =
    ignore::DeprecationWarning:starlette.*
    ignore:Using `httpx` with `starlette.testclient`
